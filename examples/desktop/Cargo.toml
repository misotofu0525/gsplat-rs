[package]
name = "desktop-example"
version = "0.1.3"
description = "Desktop validation example and PNG smoke harness for gsplat-rs."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
interactive-viewer = ["dep:winit", "dep:wgpu", "dep:pollster"]
diagnostic-surface-capture-receipt = [
    "interactive-viewer",
    "dep:sha2",
    "gsplat-render-wgpu/diagnostic-surface-capture-receipt",
]
diagnostic-surface-depth-key-candidate24 = [
    "diagnostic-surface-capture-receipt",
    "gsplat-render-wgpu/diagnostic-surface-depth-key-candidate24",
]
diagnostic-surface-depth-key-candidate20 = [
    "diagnostic-surface-capture-receipt",
    "gsplat-render-wgpu/diagnostic-surface-depth-key-candidate20",
]
diagnostic-surface-projected-axes16 = [
    "diagnostic-surface-capture-receipt",
    "gsplat-render-wgpu/diagnostic-surface-projected-axes16",
]
diagnostic-resident-sh-mantissa8 = [
    "diagnostic-surface-capture-receipt",
    "gsplat-render-wgpu/diagnostic-resident-sh-mantissa8",
]

[dependencies]
gsplat-core = { path = "../../crates/gsplat-core", version = "0.1.3" }
gsplat-render-wgpu = { path = "../../crates/gsplat-render-wgpu", version = "0.1.3" }
gsplat-io-ply = { path = "../../crates/gsplat-io-ply", version = "0.1.3" }
png = "0.17.16"
sha2 = { workspace = true, optional = true }
winit = { version = "0.30.12", optional = true }
wgpu = { workspace = true, optional = true }
pollster = { version = "0.4.0", optional = true }

[[test]]
name = "surface_geometry_entry"
path = "tests/surface_geometry_entry.rs"
harness = false
required-features = ["interactive-viewer"]
