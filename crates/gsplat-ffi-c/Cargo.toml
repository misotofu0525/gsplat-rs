[package]
name = "gsplat-ffi-c"
version = "0.1.3"
description = "Small C ABI over the gsplat-rs renderer and validation surface paths."
readme = "README.md"
keywords = ["gaussian-splatting", "ffi", "c-abi", "rendering"]
categories = ["graphics", "rendering"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
qualification-q3-cpu-scalar = ["gsplat-render-wgpu/qualification-q3-cpu-scalar"]
qualification-q3-cpu-neon = ["gsplat-render-wgpu/qualification-q3-cpu-neon"]
qualification-q3-cpu-runtime = ["gsplat-render-wgpu/qualification-q3-cpu-runtime"]

[dependencies]
gsplat-core = { path = "../gsplat-core", version = "0.1.3" }
gsplat-io-ply = { path = "../gsplat-io-ply", version = "0.1.3" }
gsplat-render-wgpu = { path = "../gsplat-render-wgpu", version = "0.1.3" }
gsplat-sort = { path = "../gsplat-sort", version = "0.1.3" }
wgpu.workspace = true
