[package]
name = "gsplat-io-sog"
version = "0.1.3"
description = "PlayCanvas SOG and Streamed SOG import for gsplat-rs."
readme = "README.md"
keywords = ["gaussian-splatting", "sog", "playcanvas", "parser"]
categories = ["parser-implementations", "graphics"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
crc32fast = "1.5.0"
flate2 = "1.1.9"
gsplat-core = { path = "../gsplat-core", version = "0.1.3" }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
