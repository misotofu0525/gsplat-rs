[package]
name = "gsplat-render-wgpu"
version = "0.1.3"
description = "wgpu renderer and surface presentation paths for gsplat-rs."
readme = "README.md"
keywords = ["gaussian-splatting", "wgpu", "gpu", "3d", "rendering"]
categories = ["graphics", "rendering::engine"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
diagnostic-surface-capture-receipt = []
diagnostic-surface-presented-depth-receipt = []
diagnostic-surface-depth-key-candidate24 = []
diagnostic-surface-depth-key-candidate20 = []
diagnostic-surface-projected-axes16 = []
diagnostic-resident-sh-mantissa8 = []
qualification-q3-cpu-scalar = ["gsplat-sort/qualification-q3-cpu-scalar"]
qualification-q3-cpu-neon = ["gsplat-sort/qualification-q3-cpu-neon"]
qualification-q3-cpu-runtime = ["gsplat-sort/qualification-q3-cpu-runtime"]

[dependencies]
gsplat-core = { path = "../gsplat-core", version = "0.1.3" }
gsplat-sort = { path = "../gsplat-sort", version = "0.1.3" }
wgpu.workspace = true
thiserror.workspace = true
bytemuck = { version = "1.20.0", features = ["derive"] }
pollster = "0.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.98"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement", "Performance", "Window"] }

[dev-dependencies]
gsplat-io-ply = { path = "../gsplat-io-ply", version = "0.1.3" }
gsplat-io-spz = { path = "../gsplat-io-spz", version = "0.1.3" }
